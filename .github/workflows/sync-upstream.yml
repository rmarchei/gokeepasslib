name: Sync upstream

on:
  schedule:
    - cron: "43 13 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'rmarchei/gokeepasslib'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/tobischo/gokeepasslib.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync-upstream
          git merge --no-edit upstream/master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
          go test ./...
      - name: Open pull request
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push --force origin sync-upstream
          if [ "$(gh pr list --head sync-upstream --state open --json number --jq length)" = "0" ]; then
            gh pr create --base master --head sync-upstream --title "Merge upstream" --body ""
          fi
